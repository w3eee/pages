<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">跟拍练 (FollowBeat) - 隐私政策 | Privacy Policy</title>
  <style>
    :root {
      --bg-color: #0D0D1A;
      --card-bg: #1A1A2E;
      --card-border: rgba(255, 255, 255, 0.08);
      --primary-gradient: linear-gradient(135deg, #FF6B35 0%, #FF3D00 100%);
      --accent-yellow: #FFB800;
      --text-main: #FFFFFF;
      --text-muted: #9E9EB8;
      --text-dim: #5C5C7A;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      padding: 0 20px 60px 20px;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
    }

    /* Top Nav with Language Switcher */
    .top-nav {
      display: flex;
      justify-content: flex-end;
      padding: 20px 0 0 0;
    }

    .lang-switcher {
      display: inline-flex;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 3px;
      gap: 2px;
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .lang-btn.active {
      background: var(--primary-gradient);
      color: #FFFFFF;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(255, 61, 0, 0.3);
    }

    .lang-btn:hover:not(.active) {
      color: #FFFFFF;
    }

    /* Header */
    header {
      text-align: center;
      padding: 30px 0 35px 0;
    }

    .app-icon {
      width: 76px;
      height: 76px;
      border-radius: 18px;
      background: var(--primary-gradient);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 32px rgba(255, 61, 0, 0.35);
      margin-bottom: 16px;
    }

    .app-icon svg {
      width: 42px;
      height: 42px;
      fill: #fff;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      background: linear-gradient(180deg, #FFFFFF 0%, #D4D4E8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .update-date {
      color: var(--text-dim);
      font-size: 0.85rem;
    }

    /* Content Card */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 32px;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    .section-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #FFFFFF;
      margin: 24px 0 12px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title:first-child {
      margin-top: 0;
    }

    .section-title span {
      color: #FF6B35;
    }

    p, ul {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 14px;
    }

    ul {
      padding-left: 20px;
    }

    li {
      margin-bottom: 6px;
    }

    .highlight-box {
      background: rgba(255, 107, 53, 0.08);
      border: 1px solid rgba(255, 107, 53, 0.25);
      border-radius: 12px;
      padding: 16px 20px;
      margin: 18px 0;
      color: #FFFFFF;
      font-size: 0.92rem;
    }

    .contact-link {
      color: #FF6B35;
      text-decoration: none;
    }

    .contact-link:hover {
      text-decoration: underline;
    }

    /* Footer */
    footer {
      text-align: center;
      padding-top: 20px;
      color: var(--text-dim);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Language Switcher -->
    <div class="top-nav">
      <div class="lang-switcher">
        <button class="lang-btn active" id="btn-zh" onclick="switchLanguage('zh')">中文</button>
        <button class="lang-btn" id="btn-en" onclick="switchLanguage('en')">English</button>
      </div>
    </div>

    <!-- Header -->
    <header>
      <div class="app-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/>
        </svg>
      </div>
      <h1 id="app-title">跟拍练 (FollowBeat) 隐私政策</h1>
      <p class="update-date" id="update-date">最后更新日期：2026年9月1日</p>
    </header>

    <!-- Content Card -->
    <div class="card" id="privacy-content">
      <!-- Dynamic Content Loaded by JS -->
    </div>

    <!-- Footer -->
    <footer>
      <p id="footer-copy">© 2026 FollowBeat. All Rights Reserved.</p>
      <p style="margin-top: 10px;">
        <a href="index.html" style="color: var(--text-muted); text-decoration: underline;">技术支持与帮助中心 (Support & Help)</a>
      </p>
    </footer>
  </div>

  <script>
    const privacyData = {
      zh: {
        pageTitle: "跟拍练 (FollowBeat) - 隐私政策 | Privacy Policy",
        appTitle: "跟拍练 (FollowBeat) 隐私政策",
        updateDate: "最后更新日期：2026年9月1日",
        content: `
          <div class="highlight-box">
            <strong>核心承诺：</strong>「跟拍练 (FollowBeat)」是一款注重隐私的单机/个人工具类 App。我们不会收集您的个人身份信息，不会追踪您的网络活动，绝不向任何第三方出售或共享您的个人运动数据。
          </div>

          <h2 class="section-title"><span>1.</span> 我们收集哪些信息？</h2>
          <p><strong>我们不收集任何个人敏感信息。</strong></p>
          <ul>
            <li><strong>无需注册账号：</strong>本 App 无需注册第三方账号，无需绑定手机号或社交账号即可使用全部功能。</li>
            <li><strong>个人运动数据：</strong>您在 App 中创建的节拍方案、动作组、每日计划与历史训练记录仅存储在您的设备本地及您个人的私有 Apple iCloud 容器中。</li>
          </ul>

          <h2 class="section-title"><span>2.</span> 数据存储与 iCloud 同步</h2>
          <p>为了在您的多台 iOS 设备间无缝同步您的自定义节拍与训练历史，「跟拍练」使用了 Apple 官方提供的 <strong>iCloud (CloudKit / SwiftData)</strong> 私有数据库服务。</p>
          <ul>
            <li>这些数据直接加密保存在您的个人 iCloud 空间中，只有您登录了相同 Apple ID 的设备能够访问。</li>
            <li>开发者及任何第三方均无权、也无法访问或读取您在 iCloud 中的任何数据。</li>
          </ul>

          <h2 class="section-title"><span>3.</span> 系统权限使用说明</h2>
          <p>为了实现核心功能，App 可能会在特定场景请求以下系统权限：</p>
          <ul>
            <li><strong>相册保存权限 (NSPhotoLibraryAddUsageDescription)：</strong>仅在您主动点击“保存训练战报海报”时使用，用于将生成的打卡图片保存到您的系统相册。我们不会读取或扫描您相册中的其他照片。</li>
            <li><strong>通知权限：</strong>仅在您主动开启训练提醒时使用，用于在设定的时间向您发送每日跟拍训练通知。</li>
          </ul>

          <h2 class="section-title"><span>4.</span> 第三方 SDK 与广告</h2>
          <p>「跟拍练」是一个纯净无广告的应用：</p>
          <ul>
            <li>不包含任何第三方广告追踪 SDK。</li>
            <li>不包含任何跨应用追踪（IDFA）代码。</li>
            <li>不与数据经纪商或广告联盟分享数据。</li>
          </ul>

          <h2 class="section-title"><span>5.</span> 儿童隐私保护</h2>
          <p>本 App 适合所有年龄段（4+）使用。我们不会有意收集或索取 13 岁以下儿童的任何个人信息。</p>

          <h2 class="section-title"><span>6.</span> 隐私政策的更新</h2>
          <p>如果我们对本隐私政策进行任何实质性修改，将通过更新本页面并在 App Store 版本说明中进行提示。</p>

          <h2 class="section-title"><span>7.</span> 联系我们</h2>
          <p>如果您对本隐私政策有任何疑问、意见或建议，请随时通过电子邮件与我们联系：<br>
          📧 <strong><a href="mailto:dudulu.moe@gmail.com" class="contact-link">dudulu.moe@gmail.com</a></strong></p>
        `,
        footerCopy: "© 2026 FollowBeat. All Rights Reserved."
      },
      en: {
        pageTitle: "FollowBeat - Privacy Policy",
        appTitle: "FollowBeat Privacy Policy",
        updateDate: "Last Updated: September 1, 2026",
        content: `
          <div class="highlight-box">
            <strong>Our Commitment:</strong> FollowBeat is a privacy-first workout rhythm companion. We do not collect your personal identifiable information, we do not track your activity across apps, and we will never sell or share your fitness data with third parties.
          </div>

          <h2 class="section-title"><span>1.</span> Information We Collect</h2>
          <p><strong>We do not collect any personally identifiable information.</strong></p>
          <ul>
            <li><strong>No Account Required:</strong> You do not need to register, log in, or provide personal details to use FollowBeat.</li>
            <li><strong>Workout Data:</strong> All custom beats, actions, daily plans, and training records are strictly stored locally on your device and inside your private Apple iCloud container.</li>
          </ul>

          <h2 class="section-title"><span>2.</span> Data Storage & iCloud Sync</h2>
          <p>To provide seamless synchronization across your iOS devices, FollowBeat utilizes Apple's official <strong>iCloud (CloudKit / SwiftData)</strong> private database.</p>
          <ul>
            <li>Your data is encrypted and stored in your private iCloud space, accessible only by devices signed into your Apple ID.</li>
            <li>The developer and third parties have no access and cannot read your personal iCloud data.</li>
          </ul>

          <h2 class="section-title"><span>3.</span> Device Permissions</h2>
          <p>FollowBeat may request standard iOS permissions solely for core functionality:</p>
          <ul>
            <li><strong>Photo Library Add Access (NSPhotoLibraryAddUsageDescription):</strong> Used only when you tap "Save Workout Poster" to save the generated summary image to your Photos. We never scan or read your existing photos.</li>
            <li><strong>Notifications:</strong> Used only if you enable training reminders to notify you at your scheduled workout time.</li>
          </ul>

          <h2 class="section-title"><span>4.</span> Third-Party SDKs & Advertising</h2>
          <p>FollowBeat is a pure and ad-free application:</p>
          <ul>
            <li>Contains zero third-party advertising or tracking SDKs.</li>
            <li>Does not request or track Apple's IDFA (Identifier for Advertisers).</li>
            <li>Never shares data with data brokers or advertising networks.</li>
          </ul>

          <h2 class="section-title"><span>5.</span> Children's Privacy</h2>
          <p>Our application is rated 4+ and suitable for all audiences. We do not knowingly collect personal information from children under 13.</p>

          <h2 class="section-title"><span>6.</span> Policy Updates</h2>
          <p>If we update this Privacy Policy, changes will be posted directly to this page and noted in App Store release notes.</p>

          <h2 class="section-title"><span>7.</span> Contact Us</h2>
          <p>If you have any questions or feedback regarding this Privacy Policy, please contact us at:<br>
          📧 <strong><a href="mailto:dudulu.moe@gmail.com" class="contact-link">dudulu.moe@gmail.com</a></strong></p>
        `,
        footerCopy: "© 2026 FollowBeat. All Rights Reserved."
      }
    };

    function switchLanguage(lang) {
      const data = privacyData[lang] || privacyData.zh;
      
      document.getElementById('page-title').innerText = data.pageTitle;
      document.getElementById('app-title').innerText = data.appTitle;
      document.getElementById('update-date').innerText = data.updateDate;
      document.getElementById('privacy-content').innerHTML = data.content;
      document.getElementById('footer-copy').innerText = data.footerCopy;

      document.getElementById('btn-zh').classList.toggle('active', lang === 'zh');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');

      localStorage.setItem('followbeat_lang', lang);
    }

    (function initLanguage() {
      const savedLang = localStorage.getItem('followbeat_lang');
      if (savedLang && (savedLang === 'zh' || savedLang === 'en')) {
        switchLanguage(savedLang);
      } else {
        const browserLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
        if (browserLang.startsWith('zh')) {
          switchLanguage('zh');
        } else {
          switchLanguage('en');
        }
      }
    })();
  </script>
</body>
</html>
